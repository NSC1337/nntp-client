[project]
name = "nntp"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"

license-files = [

    "THIRD_PARTY_NOTICES.md",
    "src/NNTPClient/parser/rapidyenc/README.md",
    "src/NNTPClient/parser/rapidyenc/crcutil-1.0/LICENSE",
    "src/NNTPClient/parser/rapidyenc/src/crc_folding.cc",
    "src/NNTPClient/parser/rapidyenc/src/hedley.h",
    "src/NNTPClient/parser/rapidyenc/src/stdint.h",
]
authors = [
    { name = "NSC1337", email = "nicholasscottcarroll@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "unrar>=0.4",
    "uvloop>=0.22.1",
]

[project.scripts]
nntp = "NNTPClient.main:main"

[dependency-groups]
dev = [
    "cython>=3.3.0",
    "py-spy>=0.4.2",
    "pytest>=9.1.1",
    "scikit-build-core>=1.0.3",
]

[build-system]
requires = [
    "scikit-build-core>=1.0.3",
    "cython>=3.3.0",
]
build-backend = "scikit_build_core.build"

[tool.scikit-build]
minimum-version = "build-system.requires"
build-dir = "build/{wheel_tag}"

wheel.packages = ["src/NNTPClient"]
cmake.source-dir = "src/NNTPClient"

[tool.scikit-build.cmake.define]
DISABLE_SHARED = "ON"
DISABLE_TOOL = "ON"

[tool.basedpyright]
typeCheckingMode = "standard"

[tool.ruff]
line-length = 100
